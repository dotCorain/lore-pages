[package]
name = "lang-framework"
version = "0.1.0"
edition = "2024"

[dev-dependencies]

[dependencies]
lang-core = { path = "../lang-core" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2+spec-1.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
