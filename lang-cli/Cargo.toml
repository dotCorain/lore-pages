[package]
name = "lang-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
lang-core = { path = "../lang-core" }
lang-framework = { path = "../lang-framework" }
lang-parser = { path = "../lang-parser" }
lang-impl = { path = "../lang-impl" }

[[bin]]
name = "lang-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
